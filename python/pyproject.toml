[project]
name = "atbootstrap"
version = "0.1.0"
description = "Python port of ATBootstrap (MACE Acoustic-Trawl Bootstrapping)"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

authors = [
  {name = "NOAA AFSC MACE"}
]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "pyproj>=3.6",
  "shapely>=2.0",
  "alphashape>=1.3",
  "matplotlib>=3.8"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
